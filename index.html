<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Arcade</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#020024,#090979,#00d4ff);
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

button {
  background: linear-gradient(135deg,#00ffcc,#33ff88);
  color: black;
  padding: 14px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  width: 220px;
}

button:hover {
  transform: scale(1.05);
}

#pot-display {
  margin: 20px;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>🎮 Monet Arcade</h1>

  <button id="connect-wallet">Connect Wallet</button>

  <div id="pot-display">Pot: 0 SOL</div>

  <button onclick="enterGame()">Enter Game (0.1 SOL)</button>
  <button onclick="payoutWinner()">End Game & Pay Winner</button>
</div>

<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>

<script>
const TREASURY = "2H5yp77LMdAqo8er1znx2jRApyCPExcHVpZPYHKkD68F";
const ENTRY_FEE = 0.1;

let wallet = null;

async function connectWallet(){
  if (!window.solana) {
    alert("Install Phantom wallet");
    return;
  }

  const resp = await window.solana.connect();
  wallet = resp.publicKey;

  document.getElementById("connect-wallet").innerText =
    wallet.toString().slice(0,4)+"..."+wallet.toString().slice(-4);
}

async function fetchPot(){
  const res = await fetch("/api/pot");
  const data = await res.json();

  document.getElementById("pot-display").innerText =
    "Pot: " + data.pot.toFixed(2) + " SOL";
}

async function enterGame(){
  if (!wallet) return alert("Connect wallet first");

  const connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");

  const tx = new solanaWeb3.Transaction().add(
    solanaWeb3.SystemProgram.transfer({
      fromPubkey: wallet,
      toPubkey: new solanaWeb3.PublicKey(TREASURY),
      lamports: ENTRY_FEE * solanaWeb3.LAMPORTS_PER_SOL,
    })
  );

  tx.feePayer = wallet;
  tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;

  const signed = await window.solana.signTransaction(tx);
  const sig = await connection.sendRawTransaction(signed.serialize());

  await connection.confirmTransaction(sig, "confirmed");

  await fetch("/api/pot", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ amount: ENTRY_FEE, tx: sig })
  });

  fetchPot();
  alert("Entered game!");
}

async function payoutWinner(){
  const winner = prompt("Winner wallet:");
  if (!winner) return;

  const res = await fetch("/api/payout", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ winner })
  });

  const data = await res.json();

  if (data.error) {
    alert(data.error);
    return;
  }

  alert("Payout TX: " + data.sig);
  fetchPot();
}

document.addEventListener("DOMContentLoaded", ()=>{
  fetchPot();
  document.getElementById("connect-wallet").onclick = connectWallet;
});
</script>

<script>
async function endGame(winnerAddress){
  if (!winnerAddress) {
    alert("No winner detected");
    return;
  }

  try {
    const res = await fetch("/api/payout", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ winner: winnerAddress })
    });

    const data = await res.json();

    if (data.error) {
      alert("Payout failed: " + data.error);
      return;
    }

    alert("🏆 Winner paid!\nTX: " + data.sig);

    if (typeof fetchPot === "function") fetchPot();

  } catch (err) {
    console.error(err);
    alert("Payout error");
  }
}

// listen for game messages
window.addEventListener("message", (e) => {
  if (e.data?.type === "MONET_GAME_END") {
    endGame(e.data.winner);
  }
});
</script>

</body>
</html>
