<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Arcade</title>

<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle,#0f0026,#000);
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar {
  width:200px;
  background:#0a001f;
  height:100vh;
  padding:20px;
}
.sidebar h2 { color:#00ffc3; }
.sidebar div {
  margin:15px 0;
  cursor:pointer;
}

/* MAIN */
.main {
  flex:1;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.wallet {
  background:#00ffc3;
  padding:10px;
  border-radius:10px;
  color:black;
  cursor:pointer;
}

/* HERO */
.hero {
  text-align:center;
}
.hero img {
  width:120px;
  border-radius:15px;
}

/* GRID */
.grid {
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(0,255,200,0.3);
  transition:0.3s;
}
.card:hover {
  transform:scale(1.03);
}

.play {
  margin-top:10px;
  background:#00ffc3;
  color:black;
  padding:12px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}

/* LEADERBOARD */
.leaderboard {
  padding:20px;
}
.entry {
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>MONET</h2>
  <div onclick="showSection('arcade')">🎮 Arcade</div>
  <div onclick="showSection('leaderboard')">🏆 Leaderboard</div>
  <div onclick="showSection('rewards')">🎁 Rewards</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
  <div>MONET ARCADE</div>
  <div class="wallet" id="walletBtn" onclick="connectWallet()">Connect</div>
</div>

<div id="arcade">

<div class="hero">
  <img src="assets/monetmario.jpg">
  <h1>THE ARCADE</h1>
</div>

<div class="grid">
  <div class="card">
    <h3>MONET MARIO</h3>
    <div class="play" onclick="play('mario')">PLAY</div>
  </div>

  <div class="card">
    <h3>MONET RUSH</h3>
    <div class="play" onclick="play('rush')">PLAY</div>
  </div>

  <div class="card">
    <h3>MONEY MUNCH</h3>
    <div class="play" onclick="play('munch')">PLAY</div>
  </div>
</div>

</div>

<!-- LEADERBOARD -->
<div id="leaderboard" style="display:none;">
  <h2 style="padding:20px;">🏆 Leaderboard</h2>
  <div id="board"></div>
</div>

<!-- REWARDS -->
<div id="rewards" style="display:none;">
  <h2 style="padding:20px;">🎁 Rewards</h2>
  <p style="padding:20px;">Coming soon: Earn MONET for high scores</p>
</div>

</div>

<script>
let wallet = null;

// WALLET
async function connectWallet(){
  if (!window.solana || !window.solana.isPhantom) {
    alert("Use Phantom browser");
    return;
  }
  const resp = await window.solana.connect();
  wallet = resp.publicKey.toString();
  document.getElementById("walletBtn").innerText =
    wallet.slice(0,4)+"..."+wallet.slice(-4);
}

// NAV
function showSection(id){
  document.getElementById("arcade").style.display="none";
  document.getElementById("leaderboard").style.display="none";
  document.getElementById("rewards").style.display="none";
  document.getElementById(id).style.display="block";
}

// PLAY
function play(game){
  if(!wallet){
    alert("Connect wallet first");
    return;
  }

  // fake score for demo
  let score = Math.floor(Math.random()*100);

  saveScore(wallet, score);

  window.location.href = "games/"+game+".html";
}

// LEADERBOARD STORAGE
function saveScore(wallet, score){
  let data = JSON.parse(localStorage.getItem("scores")||"[]");
  data.push({wallet, score});
  data.sort((a,b)=>b.score-a.score);
  data = data.slice(0,10);
  localStorage.setItem("scores", JSON.stringify(data));
  renderBoard();
}

function renderBoard(){
  let data = JSON.parse(localStorage.getItem("scores")||"[]");
  let html="";
  data.forEach((e,i)=>{
    html += `<div class="entry">
      <span>#${i+1}</span>
      <span>${e.wallet.slice(0,4)}...${e.wallet.slice(-4)}</span>
      <span>${e.score}</span>
    </div>`;
  });
  document.getElementById("board").innerHTML = html;
}

renderBoard();
</script>


<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>

<style>
.wallet-btn {
  background: linear-gradient(135deg,#00ffcc,#33ff88);
  color:#000;
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  border:none;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,255,150,0.5);
}
.wallet-btn:hover { transform: scale(1.05); }
</style>

<script>
let provider = null;

async function connectWallet() {
  try {
    if (window.solana </body></body> window.solana.isPhantom) {
      provider = window.solana;
      const resp = await provider.connect();
      updateUI(resp.publicKey.toString());
      return;
    }

    if (window.solflare) {
      provider = window.solflare;
      await provider.connect();
      updateUI(provider.publicKey.toString());
      return;
    }

    if (window.backpack) {
      provider = window.backpack;
      await provider.connect();
      updateUI(provider.publicKey.toString());
      return;
    }

    alert("No wallet found. Install Phantom / Solflare / Backpack");
    window.open("https://phantom.app/", "_blank");

  } catch (err) {
    console.error("Wallet error:", err);
  }
}

function updateUI(address) {
  const btn = document.getElementById("connect-wallet");
  if (!btn) return;
  btn.innerText = address.slice(0,4) + "..." + address.slice(-4);
}

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("connect-wallet");
  if (btn) btn.addEventListener("click", connectWallet);
});
</script>
</body>
</html>
